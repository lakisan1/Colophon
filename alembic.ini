# Alembic configuration. The database URL is deliberately NOT stored here:
# alembic/env.py injects it from app.settings so migrations always run against
# the same SQLite file the application opens (T3).

[alembic]
# %(here)s = directory of this ini file, so commands work from any cwd.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# Logging consumed by alembic/env.py via fileConfig().
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
