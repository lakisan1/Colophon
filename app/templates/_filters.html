<form class="filter-bar" method="get" action="{{ shelf_path }}">
  <label class="filter">
    <span class="filter-label">Search</span>
    <input class="filter-input" name="q" value="{{ filters.q or '' }}" maxlength="120"
           placeholder="title, author, ISBN, note">
  </label>
  <p class="filter-actions">
    <button type="submit" class="btn btn-primary">Filter</button>
  </p>
  <details class="advanced-search">
    <summary>Advanced search</summary>
    <div class="advanced-search-body">
      <label class="filter">
        <span class="filter-label">Author</span>
        <select class="searchable filter-input" name="author">
          <option value="">Anyone</option>
          {% for author in authors %}
            <option value="{{ author.id }}" {% if filters.author_id == author.id %}selected{% endif %}>
              {{ author.name }} ({{ author.book_count }})
            </option>
          {% endfor %}
        </select>
      </label>
      <label class="filter">
        <span class="filter-label">Tag</span>
        <select class="searchable filter-input" name="tag">
          <option value="">Any tag</option>
          {% for tag in tags %}
            <option value="{{ tag.id }}" {% if filters.tag_id == tag.id %}selected{% endif %}>
              {{ tag.name }} ({{ tag.book_count }})
            </option>
          {% endfor %}
        </select>
      </label>
      <label class="filter">
        <span class="filter-label">Genre</span>
        <select class="searchable filter-input" name="genre">
          <option value="">Any genre</option>
          {% for genre in genres %}
            <option value="{{ genre.notation }}" {% if filters.genre == genre.notation %}selected{% endif %}>
              {{ genre.label }} ({{ genre.book_count }})
            </option>
          {% endfor %}
        </select>
      </label>
      <label class="filter">
        <span class="filter-label">Year</span>
        <select class="searchable filter-input" name="year">
          <option value="">Any year</option>
          {% for year in years %}
            <option value="{{ year.year }}" {% if filters.year == year.year %}selected{% endif %}>{{ year.year }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="filter">
        <span class="filter-label">Reading</span>
        <select class="searchable filter-input" name="reading">
          <option value="">Any state</option>
          {% for state in reading_states %}
            <option value="{{ state }}" {% if filters.reading == state %}selected{% endif %}>{{ state }}</option>
          {% endfor %}
        </select>
      </label>
      {% if active_shelf == "library" %}
        {# The library search can also cover the gone (sold+gifted) or borrowed
           shelf; the `status` control switches which shelf is shown. #}
        <label class="filter">
          <span class="filter-label">Search scope</span>
          <select class="searchable filter-input" name="status">
            <option value="in_library" {% if filters.status == "in_library" %}selected{% endif %}>In library</option>
            <option value="gone" {% if filters.status == "gone" %}selected{% endif %}>Gone (sold/gifted)</option>
            <option value="borrowed" {% if filters.status == "borrowed" %}selected{% endif %}>Borrowed</option>
          </select>
        </label>
        <label class="filter filter-check">
          <input type="checkbox" name="all" value="1" {% if filters.search_all %}checked{% endif %}>
          Also search gone &amp; borrowed
        </label>
      {% endif %}
      <label class="filter">
        <span class="filter-label">Room</span>
        <select class="searchable filter-input" name="room">
          <option value="">Any room</option>
          {% for room in rooms %}
            <option value="{{ room.id }}" {% if filters.room == room.id %}selected{% endif %}>
              {{ room.name }} ({{ room.book_count }})
            </option>
          {% endfor %}
        </select>
      </label>
      <p class="filter-actions">
        <button type="submit" class="btn btn-primary">Filter</button>
        {% if filter_query %}
          <a class="btn" href="/export.csv?{{ filter_query }}">Export CSV</a>
          <a class="btn" href="/export.json?{{ filter_query }}">Export JSON</a>
        {% endif %}
      </p>
    </div>
  </details>
</form>
